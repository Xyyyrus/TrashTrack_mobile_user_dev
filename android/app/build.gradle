plugins {
   id "com.android.application"
   // START: FlutterFire Configuration
   id 'com.google.gms.google-services'
   // END: FlutterFire Configuration
   id "kotlin-android"
   // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
   id "dev.flutter.flutter-gradle-plugin"
   //owasp stuff
   id "org.owasp.dependencycheck" version "8.2.1"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
   localPropertiesFile.withReader("UTF-8") { reader ->
       localProperties.load(reader)
   }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
   flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
   flutterVersionName = "1.0"
}

def flutterMinSdkVersion = localProperties.getProperty("flutter.minSdkVersion")
if (flutterMinSdkVersion == null) {
   flutterMinSdkVersion = "23"
}

def flutterNdkVersion = localProperties.getProperty("flutter.ndkVersion")
if (flutterNdkVersion == null) {
   flutterNdkVersion = "25.1.8937393"
}

def flutterCompileSdkVersion = localProperties.getProperty("flutter.compileSdkVersion")
if (flutterCompileSdkVersion == null) {
   flutterCompileSdkVersion = "34"
}

def flutterTargetSdkVersion = localProperties.getProperty("flutter.targetSdkVersion")
if (flutterTargetSdkVersion == null) {
   flutterTargetSdkVersion = "34"
}
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
   keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
   namespace = "dev.luwipark.trashtrack_user"
   compileSdk = flutterCompileSdkVersion.toInteger()
   ndkVersion = flutterNdkVersion

   compileOptions {
       sourceCompatibility = JavaVersion.VERSION_1_8
       targetCompatibility = JavaVersion.VERSION_1_8
   }

   defaultConfig {
       // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
       applicationId = "dev.luwipark.trashtrack_user"
       // You can update the following values to match your application needs.
       // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
       // minSdk = flutterMinSdkVersion.toInteger()
        minSdkVersion 29
       targetSdk = flutterTargetSdkVersion.toInteger()
       versionCode = flutterVersionCode.toInteger()
       versionName = flutterVersionName

         // Enable Strict Mode for better compliance
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["strictMode.enabled": "true"]
            }
        }
   }

   // buildTypes {
   //     release {
   //         // TODO: Add your own signing config for the release build.
   //         // Signing with the debug keys for now, so `flutter run --release` works.
   //         signingConfig = signingConfigs.debug
   //     }
   // }

   signingConfigs {
       release {
           keyAlias keystoreProperties['keyAlias']
           keyPassword keystoreProperties['keyPassword']
           storeFile file(keystoreProperties['storeFile'])
           storePassword keystoreProperties['storePassword']
           
            v2SigningEnabled true
            // v3SigningEnabled true
       }
   }

   buildTypes {
    release {
        signingConfig signingConfigs.release
        minifyEnabled true // Enable code shrinking, obfuscation, and optimization
        shrinkResources true // Removes unused resources
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    
     // Additional security configurations
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            pseudoLocalesEnabled false
            zipAlignEnabled true
            
            // Enforce encryption of local files
            resValue "bool", "encrypt_files", "true"
            
            // Disable logging in release
            buildConfigField "boolean", "ENABLE_LOGGING", "false"
    }
}



   dependencyCheck {
    suppressionFile = "${projectDir}/dependency-check-suppression.xml" // path to your suppression file
    failBuildOnCVSS = 5 // example threshold
    autoUpdate = true // Automatically update vulnerability database
    failBuildOnCVSS = 7.0 // Fail build if vulnerabilities with CVSS score >= 7.0 are found
    format = 'HTML'
    outputDirectory = "${buildDir}/reports/dependency-check-report"
    }

    //dependency 
    dependencies {
    implementation 'com.google.firebase:firebase-auth:21.1.0'
   // Security-related dependencies
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.google.crypto.tink:tink-android:1.7.0'
    
    // Certificate pinning
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.3'
    
    constraints {
        implementation('com.squareup.okhttp3:okhttp:4.9.3') {
            because 'Security vulnerability in older versions'
        }
        // Force secure versions of common dependencies
        implementation('org.bouncycastle:bcprov-jdk15on:1.70')
        implementation('com.google.guava:guava:31.1-android')
    }
      }


}

flutter {
   source = "../.."
}

